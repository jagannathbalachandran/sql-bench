name: Benchmark — Snowflake

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite config path'
        default: 'configs/suites/tpcds-1tb.yml'
      run_mode:
        description: 'Run mode (sequential/concurrent)'
        default: 'sequential'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven
      - name: Build
        run: ./mvnw clean package -DskipTests
      - name: Run benchmark
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USER: ${{ secrets.SF_USER }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
          SF_SCHEMA: ${{ secrets.SF_SCHEMA }}
          SF_ROLE: ${{ secrets.SF_ROLE }}
          SF_REPORTING_WAREHOUSE: ${{ secrets.SF_REPORTING_WAREHOUSE }}
        run: |
          java -jar target/sql-bench-*-jar-with-dependencies.jar configs/benchmark.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-snowflake
          path: benchmark_results/
