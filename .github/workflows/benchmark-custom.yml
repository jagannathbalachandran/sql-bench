name: Benchmark — Custom Engine

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite config path'
        default: 'configs/suites/tpcds-1tb.yml'
      run_mode:
        description: 'Run mode (sequential/concurrent/load-profile)'
        default: 'sequential'
      runs:
        description: 'Runs per suite'
        default: '3'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven
      - name: Build
        run: ./mvnw clean package -DskipTests
      - name: Run benchmark
        env:
          CUSTOM_HOST: ${{ secrets.CUSTOM_HOST }}
          CUSTOM_PORT: ${{ secrets.CUSTOM_PORT }}
          CUSTOM_DB: ${{ secrets.CUSTOM_DB }}
          CUSTOM_USER: ${{ secrets.CUSTOM_USER }}
          CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}
          CUSTOM_SCHEMA: ${{ secrets.CUSTOM_SCHEMA }}
        run: |
          java -jar target/sql-bench-*-jar-with-dependencies.jar configs/benchmark.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-custom
          path: benchmark_results/
